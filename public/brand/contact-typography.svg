<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 900" width="750" height="900" fill="none">
  <!-- Card Base: Elegant warm off-white / architectural paper -->
  <rect width="750" height="900" rx="16" fill="#FAFAF7"/>
  
  <!-- Architectural Subtle Grid -->
  <defs>
    <pattern id="lightContactGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(10,10,11,0.035)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="750" height="900" rx="16" fill="url(#lightContactGrid)"/>
  <rect x="1" y="1" width="748" height="898" rx="15" stroke="#E2E2DD" stroke-width="1" fill="none"/>

  <!-- Top Header Metadata Bar -->
  <text x="48" y="58" fill="#4E6B00" font-family="'General Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" letter-spacing="2">[GLD® — INITIATION]</text>
  <text x="702" y="58" text-anchor="end" fill="#525258" font-family="'JetBrains Mono', monospace, sans-serif" font-size="15" font-weight="600" letter-spacing="1">VRINDAVAN // NCR</text>
  <line x1="48" y1="82" x2="702" y2="82" stroke="#E2E2DD" stroke-width="1.5"/>

  <!-- Live Status Pill Badge -->
  <g transform="translate(48, 106)">
    <rect width="320" height="38" rx="19" fill="#EDF3D8" stroke="#C4DE6E" stroke-width="1.2"/>
    <circle cx="20" cy="19" r="5" fill="#4E6B00"/>
    <text x="34" y="24" fill="#364B00" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13.5" font-weight="700" letter-spacing="1">NOW BOOKING // ACTIVE SPRINT</text>
  </g>

  <!-- Swiss Display Headline (High Contrast & Clear) -->
  <text x="48" y="215" fill="#0A0A0B" font-family="'General Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="78" font-weight="800" letter-spacing="-3.5">START A</text>
  <text x="48" y="292" fill="#0A0A0B" font-family="'General Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="78" font-weight="800" letter-spacing="-3.5">SPRINT<tspan fill="#4E6B00">.</tspan></text>

  <!-- Clear Editorial Tagline -->
  <text x="48" y="340" fill="#3D3D44" font-family="'JetBrains Mono', monospace, sans-serif" font-size="17" font-weight="600" letter-spacing="0.5">WEEKS, NOT QUARTERS. ZERO AGENCY OVERHEAD.</text>

  <!-- Divider Line -->
  <line x1="48" y1="375" x2="702" y2="375" stroke="#E2E2DD" stroke-width="1.5"/>

  <!-- 2x2 Matrix Specification Grid -->
  <!-- Row 1 Divider -->
  <line x1="48" y1="510" x2="702" y2="510" stroke="#EAEAE5" stroke-width="1.2"/>
  <!-- Center Vertical Column Divider -->
  <line x1="375" y1="375" x2="375" y2="645" stroke="#EAEAE5" stroke-width="1.2"/>
  <!-- Row 2 Bottom Divider -->
  <line x1="48" y1="645" x2="702" y2="645" stroke="#E2E2DD" stroke-width="1.5"/>

  <!-- Block 01: Response SLA -->
  <g transform="translate(48, 410)">
    <text x="0" y="0" fill="#4E6B00" font-family="'JetBrains Mono', monospace, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1">01 // RESPONSE SLA</text>
    <text x="0" y="42" fill="#0A0A0B" font-family="'General Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.8">&lt; 24 Hours</text>
    <text x="0" y="74" fill="#525258" font-family="'General Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="500">Same-day direct founder communication</text>
  </g>

  <!-- Block 02: MVP Delivery -->
  <g transform="translate(405, 410)">
    <text x="0" y="0" fill="#4E6B00" font-family="'JetBrains Mono', monospace, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1">02 // MVP DELIVERY</text>
    <text x="0" y="42" fill="#0A0A0B" font-family="'General Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.8">4 – 8 Weeks</text>
    <text x="0" y="74" fill="#525258" font-family="'General Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="500">Working software live on staging</text>
  </g>

  <!-- Block 03: Collaboration -->
  <g transform="translate(48, 545)">
    <text x="0" y="0" fill="#4E6B00" font-family="'JetBrains Mono', monospace, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1">03 // COLLABORATION</text>
    <text x="0" y="42" fill="#0A0A0B" font-family="'General Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.8">Direct Senior Core</text>
    <text x="0" y="74" fill="#525258" font-family="'General Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="500">Shared Slack &amp; weekly video demo reviews</text>
  </g>

  <!-- Block 04: IP Transfer -->
  <g transform="translate(405, 545)">
    <text x="0" y="0" fill="#4E6B00" font-family="'JetBrains Mono', monospace, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1">04 // IP OWNERSHIP</text>
    <text x="0" y="42" fill="#0A0A0B" font-family="'General Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.8">100% Assigned</text>
    <text x="0" y="74" fill="#525258" font-family="'General Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="500">Full repository, secrets &amp; asset handoff</text>
  </g>

  <!-- Technical Spec Highlight Box -->
  <g transform="translate(48, 672)">
    <rect width="654" height="92" rx="10" fill="#F2F2ED" stroke="#DFDFD7" stroke-width="1.2"/>
    <text x="24" y="34" fill="#0A0A0B" font-family="'JetBrains Mono', monospace, sans-serif" font-size="15" font-weight="700" letter-spacing="1">CORE STACK // WEB • MOBILE • AI AGENTS</text>
    <text x="24" y="60" fill="#3D3D44" font-family="'General Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="600">TypeScript 5 • Next.js 16 • React 19 • Flutter • Postgres • Redis</text>
    <text x="24" y="80" fill="#6B6B72" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13.5" font-weight="500">DEPLOYMENT: VERCEL • AWS • DOCKER CONTAINER CLUSTERS</text>
  </g>

  <!-- Footer Baseline -->
  <line x1="48" y1="790" x2="702" y2="790" stroke="#E2E2DD" stroke-width="1.5"/>

  <text x="48" y="836" fill="#0A0A0B" font-family="'General Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">GLAD STUDIO®</text>
  <text x="48" y="862" fill="#525258" font-family="'JetBrains Mono', monospace, sans-serif" font-size="14" font-weight="600">SOFTWARE &amp; AI PRODUCT STUDIO</text>

  <text x="702" y="836" text-anchor="end" fill="#0A0A0B" font-family="'JetBrains Mono', monospace, sans-serif" font-size="15" font-weight="700">TIMEZONE: IST (UTC+05:30)</text>
  <text x="702" y="862" text-anchor="end" fill="#4E6B00" font-family="'JetBrains Mono', monospace, sans-serif" font-size="14.5" font-weight="700">STATUS: ACCEPTING SPRINT INTAKE →</text>
</svg>
